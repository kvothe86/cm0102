<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>CM Challenge Pro - V32 Config Trophy Flag Fix</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <meta name="theme-color" content="#0f172a">
  
  <!-- Modern Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style id="skin-style">
    /* ==========================================================================
       1. TAILWIND-INSPIRED DESIGN SYSTEM
       ========================================================================== */
    :root {
      /* THEME: MODERN DARK (DEFAULT) */
      --bg: #0f172a;        /* slate-900 */
      --panel: #1e293b;     /* slate-800 */
      --card: #334155;      /* slate-700 */
      
      --primary: #6366f1;   /* indigo-500 */
      --primary-hov: #4f46e5; /* indigo-600 */
      
      --accent: #06b6d4;    /* cyan-500 */
      --accent2: #f43f5e;   /* rose-500 */
      
      --text: #f8fafc;      /* slate-50 */
      --muted: #94a3b8;     /* slate-400 */
      --border: #475569;    /* slate-600 */
      
      --input-bg: #020617;  /* slate-950 */
      
      --success: #22c55e;   /* green-500 */
      --danger: #ef4444;    /* red-500 */
      
      --radius: 0.75rem;    /* rounded-xl */
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --font: 'Inter', system-ui, sans-serif;
    }
    
    [data-theme="light"] {
      /* Verbeterd contrast voor Light Mode */
      --bg: #e2e8f0;        /* slate-200 */
      --panel: #ffffff;     /* white */
      --card: #f8fafc;      /* slate-50 */
      
      --primary: #4f46e5;   /* indigo-600 */
      --primary-hov: #4338ca;
      
      --accent: #0ea5e9;    /* sky-500 */
      
      --text: #0f172a;      /* slate-900 */
      --muted: #475569;     /* slate-600 */
      --border: #cbd5e1;    /* slate-300 */
      
      --input-bg: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    [data-theme="classic"] {
      /* RETRO CM 01/02 STIJL */
      --bg: #051333; 
      --panel: #051333; 
      --card: #0a1a45;
      
      --primary: #FFFF00;   /* Fel Geel */
      --primary-hov: #dada00;
      
      --accent: #D10000;    /* Rood */
      --accent2: #D10000;
      
      --text: #FFFFFF; 
      --muted: #A6B8D5; 
      --border: #FFFF00;
      
      --input-bg: #000000;
      --radius: 0px;        
      --shadow: none;
      --font: 'Verdana', Geneva, sans-serif;
    }

    /* ==========================================================================
       2. BASE STYLES
       ========================================================================== */
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; transition: background 0.2s, color 0.2s; }

    /* SCROLLBARS */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
    [data-theme="classic"] ::-webkit-scrollbar-thumb { border-radius: 0; background: var(--primary); }

    /* NAVIGATION */
    nav { 
      width: 260px; background: var(--panel); border-right: 1px solid var(--border); 
      padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; 
      position: fixed; height: 100vh; z-index: 50; overflow-y: auto; flex-shrink: 0;
    }
    
    .logo { 
      font-weight: 900; color: var(--primary); margin-bottom: 2rem; padding: 0 0.5rem;
      font-size: 1.5rem; letter-spacing: -0.05em; display: flex; align-items: center; gap: 0.5rem;
    }
    [data-theme="classic"] .logo { 
        font-family: 'Times New Roman', serif; font-style: italic; letter-spacing: 0; 
        text-transform: uppercase; text-shadow: 2px 2px 0 #000; 
        background: var(--accent); color: #fff; padding: 10px; border: 1px solid #fff; justify-content: center;
        margin-bottom: 1rem;
    }

    .nav-btn { 
      background: transparent; border: none; color: var(--muted); 
      padding: 0.75rem 1rem; text-align: left; cursor: pointer; font-weight: 600; 
      border-radius: var(--radius); font-size: 0.95rem; transition: all 0.2s; 
      display: flex; align-items: center; gap: 0.75rem; 
    }
    .nav-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
    
    [data-theme="light"] .nav-btn:hover { background: rgba(0,0,0,0.05); }
    [data-theme="light"] .nav-btn.active { box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }
    
    [data-theme="classic"] .nav-btn { border-radius: 0; color: var(--muted); }
    [data-theme="classic"] .nav-btn.active { background: var(--accent); color: #fff; border: 1px solid #fff; box-shadow: 2px 2px 0 #000; }

    .login-btn { margin-top: auto; border-top: 1px solid var(--border); padding-top: 1.5rem; border-radius: 0; color: var(--accent); }
    .login-btn.logged-in { color: var(--success); }

    /* MAIN CONTENT AREA */
    main { flex: 1; margin-left: 260px; padding: 2rem; max-width: 1400px; width: 100%; transition: margin 0.2s; }
    
    @media (max-width: 900px) { 
      nav { width: 100%; height: auto; position: fixed; bottom: 0; left: 0; top: auto; flex-direction: row; padding: 0.5rem; border-right: none; border-top: 1px solid var(--border); overflow-x: auto; justify-content: space-between; } 
      main { margin-left: 0; margin-bottom: 70px; padding: 1rem; } 
      .logo { display: none; } 
      .login-btn { margin-top: 0; border-top: none; padding: 0.5rem; }
      .nav-btn span:first-child { font-size: 1.4rem; }
      .nav-btn span:last-child { display: none; }
    }

    /* CARDS */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; } 
    .grid-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .grid-config { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; }
    @media (max-width: 800px) { .grid-config { grid-template-columns: 1fr; } }

    .card { 
      background: var(--panel); border-radius: var(--radius); padding: 1.5rem; 
      border: 1px solid var(--border); margin-bottom: 1.5rem; box-shadow: var(--shadow); 
      position: relative; overflow: hidden;
    }
    [data-theme="classic"] .card { border: 1px solid var(--primary); border-radius: 0; box-shadow: 4px 4px 0 #000; }

    /* TYPOGRAPHY */
    h1, h2, h3 { color: var(--text); margin: 0 0 1rem 0; letter-spacing: -0.025em; }
    h1 { font-size: 2rem; font-weight: 800; color: var(--primary); }
    h2 { font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; margin-bottom: 1.25rem; }
    [data-theme="classic"] h2 { background: var(--accent); color: #fff; padding: 0.5rem; text-align: center; border: 1px solid #fff; text-shadow: 1px 1px 0 #000; letter-spacing: 0; }

    p.page-desc { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.5rem; }

    /* FORMS & INPUTS */
    input, select { 
      width: 100%; padding: 0.75rem 1rem; background: var(--input-bg); 
      border: 1px solid var(--border); border-radius: 0.5rem; color: var(--text); 
      font-family: inherit; margin-bottom: 1rem; font-size: 0.95rem; transition: all 0.2s;
    }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
    [data-theme="classic"] input, [data-theme="classic"] select { border-radius: 0; box-shadow: none; border: 1px solid var(--muted); }
    [data-theme="classic"] input:focus { border-color: var(--primary); background: #000; color: #fff; }

    /* BUTTONS */
    .btn { 
      padding: 0.75rem 1.25rem; border: none; border-radius: 0.5rem; font-weight: 600; 
      cursor: pointer; font-size: 0.9rem; display: inline-flex; align-items: center; 
      justify-content: center; gap: 0.5rem; transition: all 0.2s; 
    }
    .btn:active { transform: translateY(1px); }
    
    .btn-main { background: var(--primary); color: #fff; }
    .btn-main:hover { background: var(--primary-hov); }
    
    .btn-sub { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-sub:hover { background: rgba(255,255,255,0.05); border-color: var(--muted); }
    [data-theme="light"] .btn-sub:hover { background: rgba(0,0,0,0.05); }
    
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid transparent; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); }

    [data-theme="classic"] .btn { border-radius: 0; border: 1px solid #fff; box-shadow: 2px 2px 0 #000; text-transform: uppercase; }
    [data-theme="classic"] .btn-main { background: var(--panel); color: #fff; border: 1px solid #fff; }
    [data-theme="classic"] .btn-sub { background: #000; color: var(--primary); border-color: var(--primary); }

    /* ICON ACTIONS */
    .btn-icon { 
      width: 2.25rem; height: 2.25rem; display: flex; align-items: center; justify-content: center; 
      border: none; cursor: pointer; border-radius: 0.5rem; font-size: 1rem; transition: 0.2s; flex-shrink: 0;
    }
    .btn-edit { background: rgba(34, 197, 94, 0.1); color: var(--success); }
    .btn-edit:hover { background: rgba(34, 197, 94, 0.2); }
    .btn-del { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
    .btn-del:hover { background: rgba(239, 68, 68, 0.2); }
    [data-theme="classic"] .btn-icon { border-radius: 0; border: 1px solid #fff; box-shadow: 2px 2px 0 #000; }

    /* LISTS & TABLES */
    .opt { 
      display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0; 
      border-bottom: 1px solid var(--border); gap: 10px;
    }
    .opt:hover { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.02), transparent); }
    [data-theme="light"] .opt:hover { background: linear-gradient(90deg, transparent, rgba(0,0,0,0.02), transparent); }
    
    .opt input[type="checkbox"] { width: 1.25rem; height: 1.25rem; margin: 0 1rem 0 0; accent-color: var(--primary); }
    
    table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 0.5rem; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    th { color: var(--muted); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; font-weight: 700; background: rgba(0,0,0,0.2); }
    tr:last-child td { border-bottom: none; }
    th:first-child, td:first-child { border-top-left-radius: 0.5rem; border-bottom-left-radius: 0.5rem; }
    th:last-child, td:last-child { border-top-right-radius: 0.5rem; border-bottom-right-radius: 0.5rem; }
    [data-theme="classic"] th, [data-theme="classic"] td { border-radius: 0; }

    .badge { 
      background: rgba(99, 102, 241, 0.1); color: var(--primary); border: 1px solid rgba(99, 102, 241, 0.2);
      padding: 0.25rem 0.75rem; border-radius: 99px; font-weight: 700; font-family: monospace; font-size: 0.9rem; 
    }
    [data-theme="classic"] .badge { border-radius: 0; background: #000; color: var(--primary); border: 1px solid var(--primary); }

    /* DETAILS / ACCORDION */
    details { margin-bottom: 0.5rem; border: 1px solid var(--border); border-radius: 0.5rem; overflow: hidden; background: rgba(255,255,255,0.02); }
    [data-theme="light"] details { background: rgba(0,0,0,0.01); }
    
    summary { padding: 1rem; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    summary:hover { background: rgba(255,255,255,0.02); }
    [data-theme="light"] summary:hover { background: rgba(0,0,0,0.02); }
    
    summary::after { content: '›'; font-size: 1.2rem; transition: transform 0.2s; color: var(--muted); }
    details[open] > summary::after { transform: rotate(90deg); color: var(--primary); }
    .det-content { padding: 1rem; border-top: 1px solid var(--border); background: rgba(0,0,0,0.1); }
    [data-theme="classic"] details { border-radius: 0; background: rgba(0,0,0,0.2); }
    [data-theme="classic"] summary { background: var(--panel); border-bottom: 1px solid var(--muted); color: var(--primary); }

    /* COMPONENTS */
    .rank-bar-bg { background: rgba(255,255,255,0.1); height: 0.75rem; border-radius: 99px; overflow: hidden; margin-top: 0.25rem; }
    [data-theme="light"] .rank-bar-bg { background: rgba(0,0,0,0.1); }
    .rank-bar-fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width 0.5s ease-out; }
    [data-theme="classic"] .rank-bar-bg, [data-theme="classic"] .rank-bar-fill { border-radius: 0; }
    
    .live-score-card { 
      text-align: center; padding: 2rem; background: var(--panel); border: 2px solid var(--primary); 
      border-radius: var(--radius); box-shadow: 0 0 30px rgba(99, 102, 241, 0.15); margin-bottom: 1.5rem;
    }
    [data-theme="classic"] .live-score-card { border-radius: 0; box-shadow: 4px 4px 0 #000; border: 2px solid #fff; }
    .live-score-val { font-size: 4.5rem; font-weight: 900; color: var(--primary); line-height: 1; letter-spacing: -0.05em; }

    /* DIST BAR */
    .dist-bar { height: 12px; width: 100%; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; display: flex; margin-top: 8px; }
    [data-theme="light"] .dist-bar { background: rgba(0,0,0,0.1); }
    .dist-seg { height: 100%; }
    [data-theme="classic"] .dist-bar { border-radius: 0; }

    /* DASHBOARD WIDGETS */
    .db-widget { padding: 1.5rem; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.5rem; background: rgba(0,0,0,0.1); border-radius: var(--radius); border: 1px solid var(--border); }
    .db-val { font-size: 2rem; font-weight: 900; color: var(--text); }
    .db-sub { font-size: 0.85rem; color: var(--muted); }
    [data-theme="classic"] .db-widget { border-radius: 0; background: var(--card); border: 1px solid var(--primary); }

    /* MODAL SYSTEM */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
        z-index: 2000; display: none; align-items: center; justify-content: center;
        opacity: 0; transition: opacity 0.2s;
    }
    .modal-overlay.open { display: flex; opacity: 1; }
    
    .modal-box {
        background: var(--panel); width: 90%; max-width: 500px;
        border-radius: 1rem; border: 1px solid var(--border);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        transform: scale(0.95); transition: transform 0.2s;
        display: flex; flex-direction: column; max-height: 90vh;
    }
    .modal-overlay.open .modal-box { transform: scale(1); }
    [data-theme="classic"] .modal-box { border-radius: 0; border: 2px solid #fff; box-shadow: 8px 8px 0 #000; }
    
    .modal-header { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1.25rem; font-weight: 800; color: var(--text); margin: 0; }
    .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--muted); cursor: pointer; }
    .modal-body { padding: 1.5rem; overflow-y: auto; }
    .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.75rem; background: rgba(0,0,0,0.1); border-bottom-left-radius: 1rem; border-bottom-right-radius: 1rem; }
    [data-theme="classic"] .modal-footer { border-radius: 0; }

    /* TOAST */
    #toast { 
      visibility: hidden; min-width: 300px; text-align: center; border-radius: 99px; 
      padding: 1rem 1.5rem; position: fixed; z-index: 3000; left: 50%; bottom: 30px; 
      transform: translateX(-50%); font-weight: 600; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); 
      background-color: var(--panel); color: var(--text); border: 1px solid var(--border); 
      opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    #toast.error { border-color: var(--danger); color: var(--danger); border-width: 2px; }
    #toast.success { border-color: var(--success); color: var(--success); border-width: 2px; }
    [data-theme="classic"] #toast { border-radius: 0; box-shadow: 4px 4px 0 #000; border: 1px solid #fff; }

    /* UTILS */
    .admin-only { display: none !important; }
    body.admin-mode .admin-only { display: flex !important; }
    .hidden { display: none !important; }
    .muted-text { color: var(--muted); font-size: 0.85rem; font-style: italic; }

    /* GRAPH & STATS */
    .stat-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat-box { flex: 1; min-width: 140px; background: var(--panel); padding: 1.5rem; border-radius: var(--radius); text-align: center; border: 1px solid var(--border); }
    [data-theme="classic"] .stat-box { border-radius: 0; border: 1px solid #fff; }
    .stat-val { font-size: 2rem; font-weight: 900; color: var(--primary); display: block; line-height: 1.2; }
    .stat-lbl { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: 0.05em; margin-top: 0.5rem; }

  </style>
</head>
<body class="read-only-mode">

<nav>
  <div class="logo" id="main-logo">
      <span style="background:var(--primary); color:#fff; padding:2px 8px; border-radius:6px;">CM</span> PRO
  </div>
  
  <button class="nav-btn" onclick="tab('dashboard')"><span>🏠</span> <span class="nav-lbl">Dashboard</span></button>
  <button class="nav-btn admin-only" onclick="tab('p')"><span>👥</span> <span class="nav-lbl">Managers</span></button>
  <button class="nav-btn admin-only" onclick="tab('s')"><span>📝</span> <span class="nav-lbl">Seizoen</span></button>
  <button class="nav-btn" onclick="tab('r')"><span>🎲</span> <span class="nav-lbl">RAD</span></button>
  <button class="nav-btn" onclick="tab('st')"><span>📊</span> <span class="nav-lbl">Stats</span></button>

<div id="toast"></div>

<!-- MODAL STRUCTURE -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="m-title">Titel</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>

    </div>

<script>
  // ==========================================================
  // CONFIGURATIE
  // ==========================================================
  const CLOUD_CONFIG = {
      binId: "785b374d331c9c82148e", 
      password: "bjorn"
  };

  // --- 1. STATE & INIT ---
  let APP_MODE = "READ_ONLY";
  const THEMES = ['dark', 'light', 'classic'];
  let theme = localStorage.getItem('CM_THEME_V32') || 'dark';

  let db = JSON.parse(localStorage.getItem('CM_DB_V32')) || { players: [], currentSeason: "01/02" };
  if(!db.currentSeason) db.currentSeason = "01/02"; 

  // Default Config
  let cfg = JSON.parse(localStorage.getItem('CM_CFG_V32')) || { 
    points: { 
        "Nationaal": { "Landskampioen": {v:10, t:true}, "Bekerwinnaar": {v:6, t:true}, "Promotie": {v:5, t:true}, "Degradatie": {v:-10, t:false} }, 
        "Supercup": { "Nat. Supercup": {v:2, t:true}, "Europese Supercup": {v:4, t:true} },
        "Internationaal": { "CL Winnaar": {v:20, t:true}, "UEFA Winnaar": {v:12, t:true} },
        "Wereld (Clubs)": { "Wereldbeker": {v:8, t:true} },
        "Landenteams": { "WK Winnaar": {v:25, t:true}, "EK Winnaar": {v:20, t:true} },
        "Trophy Drought": { "Geen Prijzen": {v:0, t:false} },
        "Teamwissel": { "Ontslag": {v:-5, t:false}, "Overstap": {v:0, t:false} }
    },
    rad_challenges: { "Transfers": { "Koop 35+ speler": 10 } }, 
    goals: { "Beginner": 100, "Zilver": 200, "Goud": 300, "Legend": 500 } 
  };

  // State variabelen
  let curTab = 'dashboard', editIdx = null, activeRadP = null;
  // Initialize RAD Filter to Current Season
  let histFilterM='ALL', histFilterS='ALL', radFilterS=db.currentSeason, statsFilterC='ALL';
  let statsFilters = {}; 

  // --- 2. LOGIC HELPERS ---
  const Cloud = {
      init: async function() {
          if (!CLOUD_CONFIG.binId) return;
          showToast("Data ophalen...", "info");
          await this.loadFromCloud();
      },
      loadFromCloud: async function() {
          try {
              const res = await fetch(`https://api.npoint.io/${CLOUD_CONFIG.binId}?t=${Date.now()}`);
              if(!res.ok) throw new Error("Fout");
              const data = await res.json();
              if(data && (data.db || data.cfg)) {
                  if(data.db) db = data.db;
                  if(data.cfg) cfg = data.cfg;
                  
                  // Ensure Config Migration / Defaults
                  if(!cfg.points["Supercup"]) cfg.points["Supercup"] = { "Nat. Supercup": {v:2, t:true} };
                  if(!cfg.points["Teamwissel"]) cfg.points["Teamwissel"] = { "Overstap": {v:0, t:false} };
                  
                  localStorage.setItem('CM_DB_V32', JSON.stringify(db));
                  localStorage.setItem('CM_CFG_V32', JSON.stringify(cfg));
                  
                  recalcTotals(); 
                  render();
                  showToast("Gesynchroniseerd ✅", "success");
              }
          } catch(e) { console.error(e); showToast("Offline modus", "info"); }
      },
      saveToCloud: async function() {
          if(APP_MODE !== "ADMIN") return;
          showToast("Opslaan...", "info");
          try {
              await fetch(`https://api.npoint.io/${CLOUD_CONFIG.binId}`, {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ db: db, cfg: cfg })
              });
              showToast("Opgeslagen in Cloud! ☁️", "success");
          } catch(e) { showToast("Opslaan mislukt", "error"); }
      }
  };

  // --- 4. CORE FUNCTIONS ---
  function saveAll() {

      if(APP_MODE === "ADMIN") Cloud.saveToCloud();

  function toggleTheme() { theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]; localStorage.setItem('CM_THEME_V32', theme); updateUI(); }
  function showToast(msg, type = 'info') { const x = document.getElementById("toast"); x.innerText = msg; x.className = `show ${type}`; setTimeout(() => { x.className = ""; }, 3000); }
  function esc(str) { if(typeof str!=='string') return str; return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function getRank(pts) {
    const s = Object.entries(cfg.goals).sort((a,b) => a[1] - b[1]);
    let c = "Beginner", min = 0, max = s[0][1], idx = 0;
    for(let i=0; i<s.length; i++) { if(pts >= s[i][1]) { c = s[i][0]; min = s[i][1]; max = s[i+1] ? s[i+1][1] : min; idx = i+1; } }
    const icons = ["🥉", "🥈", "🥇", "💎", "👑"];
    let icon = (idx < icons.length && idx > 0) ? icons[idx-1] : (idx>0 ? "🏆" : "");
    const perc = max > min ? Math.min(100, ((pts - min) / (max - min)) * 100) : 100;
    return { name: c, perc: perc, max: max, icon: icon, isRanked: idx > 0 };
  }

  function updateUI() {
    document.body.setAttribute('data-theme', theme);
    document.getElementById('theme-icon').innerText = theme==='light'?'☀️':(theme==='classic'?'💾':'🌙');
    // Classic Logo Fix
    const logo = document.getElementById('main-logo');
    if(theme==='classic'){
        logo.innerHTML = 'CHAMPIONSHIP MANAGER';
        logo.style.background = 'var(--accent)';
    } else {
        logo.innerHTML = '<span style="background:var(--primary); color:#fff; padding:2px 8px; border-radius:6px;">CM</span> PRO';
        logo.style.background = 'transparent';
    }
    render();
  }
  
  function tab(name) { 
      curTab = name; editIdx = null; 
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      if(btn) btn.classList.add('active'); 
      render(); 
  }
  
  // -- RECALC HELPER --
  function recalcTotals() {
      db.players.forEach(p => {
          p.seasons.forEach(s => {
              let iPts = 0;
              if(s.items && s.items.length) {
                  s.items.forEach(itm => {
                      for(let cat in cfg.points) {
                          if(cfg.points[cat][itm]) {
                              iPts += (typeof cfg.points[cat][itm] === 'object' ? cfg.points[cat][itm].v : cfg.points[cat][itm]);
                          }
                      }
                  });
              }
              s.itemPts = iPts;
              
              const seasonRads = p.rads.filter(r => r.s === s.year && r.done);
              const radPts = seasonRads.reduce((a,b) => a+b.pts, 0);
              
              s.total = iPts + radPts; 
          });
      });
  }

    if(renderers[curTab]) renderers[curTab](app);
  }

              <td style="text-align:right;"><span class="badge">${l.total}</span></td>
            </tr>`; }).join('')}
          </tbody>
        </table>
      </div>`;

    // 2. Fun Facts Logic
    if(db.players.length > 0) {
        // Totaal Seizoenen (Unique Years)
        const allYears = new Set();
        db.players.forEach(p => p.seasons.forEach(s => allYears.add(s.year)));
        const uniqueSeasons = allYears.size;

        // Club Hopper (Most unique clubs)
        let maxClubs = {p: '-', c: 0};
        db.players.forEach(p => {
            const unique = new Set(p.seasons.map(s => s.club)).size;
            if(unique > maxClubs.c) maxClubs = {p: p.name, c: unique};
        });

        // One Club Man (Max seasons at specific club)
        let maxLoyalty = {p: '-', c: '-', n: 0};
        db.players.forEach(p => {
            const counts = {};
            p.seasons.forEach(s => { if(s.club) counts[s.club] = (counts[s.club] || 0) + 1; });
            for(let c in counts) {
                if(counts[c] > maxLoyalty.n) maxLoyalty = {p: p.name, c: c, n: counts[c]};
            }
        });

        // Global Stats
        const totalManagers = db.players.length;
        const totalTrophies = db.players.reduce((acc, p) => acc + p.seasons.reduce((sa, s) => sa + (s.items?.length || 0), 0), 0);

        html += `
        <h2 style="margin-top:2rem; margin-bottom:0.5rem; border:none; color:var(--text); font-size:1.2rem;">Competitie Feiten</h2>
        <div class="grid-dashboard">
            <div class="db-widget">
                <div class="db-val" style="color:var(--primary);">📅 ${uniqueSeasons}</div>
                <div class="db-sub">Totaal Seizoenen</div>
            </div>
            <div class="db-widget">
                <div class="db-val" style="color:var(--success);">🏆 ${totalTrophies}</div>
                <div class="db-sub">Totaal Prijzen</div>
            </div>
            <div class="db-widget">
                <div class="db-val" style="color:var(--accent);">🧳 ${maxClubs.c > 0 ? maxClubs.p : '-'}</div>
                <div class="db-sub">Clubhopper (${maxClubs.c} clubs)</div>
            </div>
            <div class="db-widget">
                <div class="db-val" style="color:var(--accent2);">❤️ ${maxLoyalty.n > 0 ? maxLoyalty.p : '-'}</div>
                <div class="db-sub">Clubliefde (${maxLoyalty.n}x ${maxLoyalty.c})</div>
            </div>
        </div>
        `;
    }

    // 3. Rank Legend
    const sortedGoals = Object.entries(cfg.goals).sort((a,b) => a[1] - b[1]);
    const icons = ["🥉", "🥈", "🥇", "💎", "👑"];
    
    let legendHtml = `
    <div class="card" style="margin-top:1.5rem;">
        <h3 style="margin-bottom:1rem; font-size:1rem; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); padding-bottom:0.5rem;">Ranglijst Legenda</h3>
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:1rem;">
            <div style="display:flex; align-items:center; gap:0.75rem; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:var(--radius); border:1px solid var(--border);">
                <span style="font-size:1.5rem; width:30px; text-align:center; opacity:0.5;">👶</span>
                <div><div style="font-weight:700; font-size:0.9rem;">Beginner</div><div style="font-size:0.75rem; color:var(--muted);">0 pnt</div></div>
            </div>
    `;
    
    sortedGoals.forEach((g, i) => {
        const icon = i < icons.length ? icons[i] : "🏆";
        legendHtml += `
            <div style="display:flex; align-items:center; gap:0.75rem; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:var(--radius); border:1px solid var(--border);">
                <span style="font-size:1.5rem; width:30px; text-align:center;">${icon}</span>
                <div><div style="font-weight:700; font-size:0.9rem;">${esc(g[0])}</div><div style="font-size:0.75rem; color:var(--muted);">${g[1]} pnt</div></div>
            </div>
        `;
    });
    legendHtml += `</div></div>`;

    con.innerHTML = html + legendHtml;
  }

  function upS() {
      const pId = document.getElementById('selP')?.value; if(!pId) return;
      const p = db.players.find(x => x.id == pId); 
      let formYear = document.getElementById('inpY').value || db.currentSeason;
      let curS = (editIdx!==null) ? p.seasons[editIdx] : null; 
      
      if(curS && editIdx!==null) {
         formYear = curS.year; document.getElementById('inpY').value = formYear;
         document.getElementById('inpTSN').value = curS.tsName || ''; document.getElementById('inpTSG').value = curS.tsGoals || '';
         document.getElementById('inpRate').value = curS.rating || ''; document.getElementById('inpC').value = curS.club || '';
      }
      
      let h = '';
      const preferredOrder = ['Nationaal', 'Supercup', 'Internationaal', 'Wereld (Clubs)', 'Landenteams', 'Trophy Drought', 'Teamwissel'];
      const keys = Object.keys(cfg.points).sort((a,b) => {
          let ia = preferredOrder.indexOf(a), ib = preferredOrder.indexOf(b);
          if(ia===-1) ia=99; if(ib===-1) ib=99;
          return ia - ib;
      });

      for(let c of keys) { 
          h += `<details><summary>${c}</summary><div class="det-content">`; 
          for(let k in cfg.points[c]) { 
              let item = cfg.points[c][k];
              let val = (typeof item === 'object') ? item.v : item;
              let chk = (curS && curS.items.includes(k)) ? 'checked' : ''; 
              h += `<label class="opt"><div style="display:flex; align-items:center;"><input type="checkbox" class="p-cb" onchange="calcLive()" data-v="${val}" data-n="${k}" ${chk}><span>${k}</span></div><span class="badge" style="background:transparent; border:none; color:var(--muted);">${val>0?'+':''}${val}</span></label>`; 
          } 
          h += `</div></details>`; 
      }
      const rads = p.rads.filter(r => r.s === formYear);
      if(rads.length) { 
          h += `<h4 style="margin:1.5rem 0 0.5rem 0; color:var(--accent); text-transform:uppercase; font-size:0.8rem; font-weight:700;">RAD Challenges (${formYear})</h4>`; 
          rads.forEach(r => h += `<label class="opt"><div style="display:flex; align-items:center;"><input type="checkbox" class="r-cb" onchange="calcLive()" data-id="${r.id}" ${r.done?'checked':''}><span>${esc(r.text)}</span></div><span class="badge" style="background:transparent; border:none; color:var(--accent);">+${r.pts}</span></label>`); 
      }
      document.getElementById('scoreArea').innerHTML = h;
      document.getElementById('quickHist').innerHTML = p.seasons.map((s,i) => `<div class="opt"><span><b>${s.year}</b> - ${esc(s.club)} (${s.total}p)</span><div class="action-group"><button class="btn-icon btn-edit" onclick="editSeason('${p.id}',${i})">✏️</button><button class="btn-icon btn-del" onclick="delS('${p.id}',${i})">🗑️</button></div></div>`).reverse().join('');
      calcLive();
  }
  function calcLive() {
      const pId = document.getElementById('selP').value; const p = db.players.find(x => x.id == pId);
      let t=0; document.querySelectorAll('.p-cb:checked').forEach(c => t+=parseInt(c.dataset.v));
      document.querySelectorAll('.r-cb:checked').forEach(c => { const r=p.rads.find(x=>x.id==c.dataset.id); if(r) t+=r.pts; });
      document.getElementById('livePts').innerText = t;
  }
  function saveS() {
      const pId = document.getElementById('selP').value; const p = db.players.find(x => x.id == pId);
      let formYear = document.getElementById('inpY').value;
      
      let itemPts = 0; 
      let its = [];
      
      document.querySelectorAll('.p-cb:checked').forEach(c => { 
          itemPts += parseInt(c.dataset.v); 
          its.push(c.dataset.n); 
      });
      
      let radPtsForThisEntry = 0;
      document.querySelectorAll('.r-cb').forEach(c => { 
          const r=p.rads.find(x=>x.id==c.dataset.id); 
          if(r){ 
              r.done=c.checked; 
              if(c.checked) radPtsForThisEntry += r.pts; 
          } 
      });
      
      const totalStored = itemPts + radPtsForThisEntry;

      const d = { 
          year: formYear, 
          club: document.getElementById('inpC').value, 
          total: totalStored, 
          itemPts: itemPts, 
          items: its, 
          tsName: document.getElementById('inpTSN').value, 
          tsGoals: document.getElementById('inpTSG').value, 
          rating: document.getElementById('inpRate').value 
      };
      
      if(editIdx!==null) p.seasons[editIdx]=d; else p.seasons.push(d); 
      editIdx=null; 
      saveAll(); 
      render(); 
      showToast("Opgeslagen", 'success');
  }
  function editSeason(pId, idx) { editIdx = idx; const p = db.players.find(x => x.id == pId); const s = p.seasons[idx]; render(); document.getElementById('selP').value = pId; document.getElementById('inpC').value = s.club; upS(); }
  
  function delS(pId, idx) { 
      if(confirm("Seizoen verwijderen? Let op: Challenges van dit jaar worden automatisch op 'niet gehaald' gezet.")) {
          const p = db.players.find(x => x.id == pId);
          const s = p.seasons[idx];
          if(p.rads) {
              p.rads.forEach(r => {
                  if(r.s === s.year) r.done = false;
              });
          }
          p.seasons.splice(idx,1); 
          saveAll(); 
          render();
          showToast("Verwijderd & Challenges Gereset", "info");
      } 
  }
  
  function cancelEdit() { editIdx = null; render(); }
  
  function modalAdvanceSeason() {
      let next = db.currentSeason;
      if(next.includes('/')) { let parts=next.split('/'); let y1=parseInt(parts[0]); let y2=parseInt(parts[1]); if(!isNaN(y1)) next = (y1+1<10?'0'+(y1+1):(y1+1)) + '/' + (y2+1<10?'0'+(y2+1):(y2+1)); }
      openModal("Seizoen Afsluiten", `<p>Weet je het zeker? Huidig: <b>${db.currentSeason}</b> -> Nieuw: <b>${next}</b></p>`, `<button class="btn btn-sub" onclick="closeModal()">Annuleer</button><button class="btn btn-main" onclick="doAdvance('${next}')">Start ${next}</button>`);
  }
  function doAdvance(n) { db.currentSeason = n; radFilterS = n; saveAll(); render(); closeModal(); showToast(`Seizoen ${n} gestart!`, "success"); }

  // --- 6. RAD SYSTEM (UPDATED LOGIC V24) ---

  // CORE RAD LOGIC UPDATE V24
  function roll() { 
    const s = document.getElementById('rS').value; 
    if(!s){ showToast("Geen jaar ingevuld", 'error'); return; } 
    
    const p = db.players.find(x => x.id == activeRadP); 
    
    const catsThisSeason = new Set();
    p.rads.filter(r => r.s === s).forEach(r => {
        const cat = getCatForTask(r.text);
        if(cat) catsThisSeason.add(cat);
    });

    const playerHistoryTasks = new Set(p.rads.map(r => r.text));
    const globalDoneThisSeason = new Set();
    db.players.forEach(pl => {
        pl.rads.forEach(r => {
            if(r.s === s) globalDoneThisSeason.add(r.text);
        });
    });

    let validPool = [];

    for(let cat in cfg.rad_challenges) {
        if(catsThisSeason.has(cat)) continue;

        const allTasksInCat = Object.keys(cfg.rad_challenges[cat]);
        let availableInCat = allTasksInCat.filter(t => !playerHistoryTasks.has(t));
        
        if(availableInCat.length === 0) {
            availableInCat = allTasksInCat;
        }

        availableInCat = availableInCat.filter(t => !globalDoneThisSeason.has(t));

        availableInCat.forEach(t => {
            validPool.push({
                t: t, 
                p: cfg.rad_challenges[cat][t], 
                c: cat
            });
        });
    }

    if(!validPool.length) { showToast("Geen challenges beschikbaar (check filters/cats)!", 'error'); return; } 
    
    const out = document.getElementById('rOut'); 
    out.style.borderColor = 'var(--primary)';
    let i=0; 
    const spin = setInterval(() => { 
        const r = validPool[Math.floor(Math.random() * validPool.length)]; 
        out.innerHTML = `<span style="font-size:1.2rem; font-weight:800; color:var(--text);">${r.t}</span>`; 
        i++; 
        if(i>15) { 
            clearInterval(spin); 
            finalizeRoll(r, p, s); 
        } 
    }, 80); 
  }
  
  function getCatForTask(tName) {
      for(let c in cfg.rad_challenges) {
          if(cfg.rad_challenges[c][tName] !== undefined) return c;
      }
      return null;
  }

  function finalizeRoll(pick, p, s) { 
      const out = document.getElementById('rOut');
      out.style.background = "rgba(99, 102, 241, 0.1)";
      out.innerHTML = `<div style="font-size:0.8rem; color:var(--accent); text-transform:uppercase; letter-spacing:1px; margin-bottom:0.5rem;">${pick.c}</div><div style="font-size:1.4rem; margin:5px 0; font-weight:900;">${pick.t}</div><div class="badge" style="margin-top:0.5rem;">+${pick.p} pnt</div>`; 
      
      p.rads.push({id:Date.now(), s:s, text:pick.t, pts:pick.p, done:false}); 
      saveAll(); 
      setTimeout(()=>render(), 3000); 
      showToast("Challenge toegewezen!", 'success'); 
  }
  
  function delRad(pId, rId) { const p=db.players.find(x=>x.id==pId); p.rads=p.rads.filter(r=>r.id!=rId); saveAll(); render(); }
  
  function modalManualRad() {
     const cOpts = Object.keys(cfg.rad_challenges).map(c => `<option value="${c}">${c}</option>`).join('');
     openModal("Handmatig Toevoegen", 
        `<label class="stat-lbl">Categorie</label><select id="radCatSel" onchange="upRadT()">${cOpts}</select>
         <label class="stat-lbl">Challenge</label><select id="radTaskSel" onchange="fillRad()"></select>
         <div style="display:flex; gap:10px; margin-top:10px;"><input id="cT" placeholder="Custom..." style="flex:2"><input id="cP" type="number" placeholder="Pts" style="width:80px"></div>`,
        `<button class="btn btn-sub" onclick="closeModal()">Sluit</button><button class="btn btn-main" onclick="addManRad()">Toevoegen</button>`
     );
     setTimeout(upRadT, 100);
  }
  function upRadT() { const c=document.getElementById('radCatSel').value, s=document.getElementById('radTaskSel'); s.innerHTML=''; if(cfg.rad_challenges[c]) for(let k in cfg.rad_challenges[c]){ let o=document.createElement('option'); o.value=k; o.text=k; o.dataset.p=cfg.rad_challenges[c][k]; s.add(o); } fillRad(); }
  function fillRad() { const s=document.getElementById('radTaskSel'); if(s.selectedIndex>=0){ document.getElementById('cT').value=s.value; document.getElementById('cP').value=s.options[s.selectedIndex].dataset.p; } }
  function addManRad() { 
      const s=document.getElementById('rS').value, tx=document.getElementById('cT').value, pVal=parseInt(document.getElementById('cP').value); 
      if(s&&tx&&!isNaN(pVal)){ 
          db.players.find(x=>x.id==activeRadP).rads.push({id:Date.now(), s:s, text:tx, pts:pVal, done:false}); 
          saveAll(); render(); closeModal(); showToast("Challenge toegevoegd", 'success'); 
      } 
  }

  // --- 7. STATS & HISTORY ---

     <div class="stat-row">

        <div class="stat-box"><span class="stat-val">${mt.v}</span><span class="stat-lbl">Trophy Collector<br><span style="color:var(--text); font-weight:normal; text-transform:none;">${esc(mt.p)}</span></span></div>
        <div class="stat-box"><span class="stat-val">${rk.v}</span><span class="stat-lbl">RAD Meester<br><span style="color:var(--text); font-weight:normal; text-transform:none;">${esc(rk.p)}</span></span></div>
     </div>
     ${filterBar}`;
     
     db.players.forEach(p => {
         if(histFilterM !== 'ALL' && p.id != histFilterM) return;
         let filterC = statsFilters[p.id] || 'ALL';
         let seasons = p.seasons; if(filterC !== 'ALL') seasons = seasons.filter(s => s.club === filterC);
         
         // Fix totals for Stats view
         let itemTot = seasons.reduce((a, s) => a + (s.itemPts !== undefined ? s.itemPts : 0), 0);
         // Filter RADs relevant to the filtered seasons
         let relevantYears = seasons.map(s=>s.year);
         let relevantRads = p.rads.filter(r => relevantYears.includes(r.s));
         
         let radTot = relevantRads.filter(r=>r.done).reduce((a,r)=>a+r.pts, 0);
         let tot = itemTot + radTot;

         let totRads = relevantRads.length, doneRads = relevantRads.filter(r=>r.done).length, gPerc = totRads>0?Math.round((doneRads/totRads)*100):0;
         
         // Distribution Calc
         let pp1 = tot>0?(itemTot/tot)*100:0, pp2 = tot>0?(radTot/tot)*100:0;

         let pTopS = {n:'-', g:0, y:'-'}; let totRate = 0, ratedCnt = 0; 
         seasons.forEach(s => { let g = parseInt(s.tsGoals || 0); if(g > pTopS.g) pTopS = {n:s.tsName, g:g, y:s.year}; if(s.rating) { totRate += parseFloat(s.rating); ratedCnt++; } });
         let avgRate = ratedCnt > 0 ? (totRate / ratedCnt).toFixed(1) : '-';
         
         const rp = getRank(tot);
         const myClubs = [...new Set(p.seasons.map(s => s.club))].filter(c=>c).sort();
         const clubSel = `<select style="width:auto; padding:0.25rem 1rem;" onchange="setStatsFilter('${p.id}', this.value)"><option value="ALL">Alle Clubs</option>${myClubs.map(c=>`<option value="${c}" ${filterC==c?'selected':''}>${esc(c)}</option>`).join('')}</select>`;

         h += `<div class="card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
                <div style="display:flex; align-items:center; gap:0.75rem;">
                    <h1 style="margin:0; font-size:1.75rem;">${esc(p.name)}</h1>
                    ${rp.isRanked ? `<span class="badge" style="background:var(--accent); color:#fff; border:none;">${rp.icon} ${rp.name}</span>` : ''}
                </div>
                ${clubSel}
            </div>
            
            <div style="display:flex; gap:1.5rem; flex-wrap:wrap; margin-bottom:1.5rem;">
                <div style="flex:3; min-width:300px; height:180px; background:rgba(0,0,0,0.1); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; display:flex; flex-direction:column;">
                    <div style="padding:10px; font-size:0.75rem; color:var(--muted); text-transform:uppercase; font-weight:bold;">Progressie</div>
                    <div style="flex:1; padding:0 10px 10px 10px;">${renderGraph(seasons)}</div>
                </div>
                <div style="flex:1; min-width:120px; display:flex; flex-direction:column; gap:1rem;">
                    <div style="background:rgba(99, 102, 241, 0.1); border:1px solid var(--primary); border-radius:var(--radius); padding:1rem; text-align:center;">
                        <div style="font-size:2rem; font-weight:900; color:var(--primary);">${avgRate}</div>
                        <div class="stat-lbl">Gem. Cijfer</div>
                    </div>
                </div>
            </div>
            
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:1.5rem; border-top:1px solid var(--border); padding-top:1.5rem;">

                    ${pTopS.g > 0 ? `<div style="margin-top:1rem; background:rgba(0,0,0,0.2); padding:1rem; border-radius:var(--radius);">Topscorer: <b style="color:var(--accent)">${esc(pTopS.n)}</b> (${pTopS.g}) <span class="muted-text">${pTopS.y}</span></div>` : ''}

                             <span>Voltooid: <b>${doneRads}</b></span>

                    </div>

            <div style="border-top:1px solid var(--border); margin-top:1.5rem; padding-top:1rem;">

                </div>
            </div>
         </div>`;
     });
     con.innerHTML = h;
  }
  
  function setStatsFilter(pId, val) { statsFilters[pId] = val; render(); }
  function isTrophy(cat, item) { if(cfg.points[cat] && cfg.points[cat][item]) return cfg.points[cat][item].t; for(let c in cfg.points) if(cfg.points[c][item]) return cfg.points[c][item].t; return false; }
  
  function renderTrophies(seasons) {
      let clubs = {}; seasons.forEach(s => { if(!clubs[s.club]) clubs[s.club] = []; (s.items||[]).forEach(i => clubs[s.club].push(i)); });
      let html = ''; 
      for(let c in clubs) { 
          if(!clubs[c].length) continue; 
          let counts = {}; 
          clubs[c].forEach(item => { if(isTrophy('Nationaal', item) || isTrophy('Europees', item) || isTrophy(Object.keys(cfg.points)[0], item)) counts[item] = (counts[item]||0)+1; });
          if(Object.keys(counts).length === 0) continue; 
          html += `<div style="margin-top:0.5rem; font-weight:800; color:var(--muted); text-transform:uppercase; font-size:0.75rem;">${esc(c)}</div>`; 
          for(let k in counts) { 
             let icon = "🏆"; 
             if(k.includes("Beker")) icon="🍷"; if(k.includes("CL") || k.includes("Europees")) icon="🇪🇺"; if(k.includes("Promotie")) icon="🆙";
             html += `<div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border); padding:4px 0;"><span>${counts[k]}x ${k}</span><span>${icon.repeat(Math.min(5, counts[k]))}</span></div>`; 
          } 
      }
      return html || '<div class="muted-text">Nog geen prijzen.</div>';
  }
  
  function renderGraph(seasons) {
      if(seasons.length < 1) return '<div style="display:flex; align-items:center; justify-content:center; height:100%;" class="muted-text">Geen data</div>';
      const w = 600, h = 140; const maxVal = Math.max(...seasons.map(s=>s.total), 10);
      const barWidth = (w / seasons.length) * 0.6; const gap = (w / seasons.length) * 0.4;
      let svg = `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible">`;
      seasons.forEach((s, i) => {
          const x = (i * (w / seasons.length)) + (gap/2);
          const barH = (s.total / maxVal) * (h - 20);
          svg += `<rect x="${x}" y="${h-barH}" width="${barWidth}" height="${barH}" fill="var(--primary)" rx="4" opacity="0.8" /><text x="${x + barWidth/2}" y="${h-barH - 5}" fill="var(--text)" text-anchor="middle" font-size="20" font-weight="bold">${s.total}</text>`;
      });
      return svg + `</svg>`;
  }

  function renderHistory(con) {
     const mOpts = `<option value="ALL">Alle Managers</option>` + db.players.map(p=>`<option value="${p.id}" ${p.id==histFilterM?'selected':''}>${esc(p.name)}</option>`).join('');
     const seasons = [...new Set(db.players.flatMap(p => p.seasons.map(s => s.year)))].sort().reverse();
     const sOpts = `<option value="ALL">Alle Seizoenen</option>` + seasons.map(s => `<option value="${s}" ${s==histFilterS?'selected':''}>${s}</option>`).join('');
     let rows = []; db.players.forEach(p => p.seasons.forEach((s,i) => rows.push({id:p.id, name:p.name, s:s, idx:i, rads: p.rads.filter(r => r.s === s.year && r.done)})));
     rows = rows.filter(r => (histFilterM==='ALL' || r.id==histFilterM) && (histFilterS==='ALL' || r.s.year==histFilterS));
     rows.sort((a,b) => b.s.year.localeCompare(a.s.year));

     const getTrophies = (r) => { 
        let items = [...(r.s.items || [])]; 
        if(!items.length) return '-';

     };
     
     const getRads = (r) => {

     };
     
     con.innerHTML = `<div class="card"><h2>Historie</h2>

  }

    };
    
    // Ranks Section
    let ranksHTML = `<div class="card"><h2>Ranks (Doelen)</h2><div class="det-content" style="background:transparent; border:none; padding:0;">`;
    Object.entries(cfg.goals).sort((a,b)=>a[1]-b[1]).forEach(([k, v]) => { 
        ranksHTML += `<div class="opt">
            <input value="${k}" onchange="rnRank('${k}',this.value)" style="margin-bottom:0; flex:2; margin-right:10px;">
            <input type="number" value="${v}" onchange="upRank('${k}',this.value)" style="width:80px; margin-bottom:0; flex:none;">
            <button class="btn-icon btn-del" onclick="delRank('${k}')" style="margin-left:10px;">🗑️</button>
        </div>`; 
    });
    ranksHTML += `<div style="display:flex; gap:10px; margin-top:1rem;"><input id="newRankN" placeholder="Nieuwe Rank..." style="margin-bottom:0;"><input id="newRankV" type="number" placeholder="0" style="width:80px; margin-bottom:0;"><button class="btn btn-main" onclick="addRank()">+</button></div></div></div>`;

    con.innerHTML = `<div class="grid-config">
       <div>${renderSection('Punten', 'points', cfg.points)}${renderSection('RAD Challenges', 'rad', cfg.rad_challenges)}</div>
       <div>
         ${ranksHTML}
         <div class="card"><h2>Systeem</h2>
            <label class="stat-lbl">Huidig Seizoen</label>
            <div style="display:flex; gap:10px; margin-bottom:1.5rem;">
                <input id="sysSeason" value="${db.currentSeason}" style="margin-bottom:0;">
                <button class="btn btn-main" onclick="setSysSeason()">Opslaan</button>
            </div>
            <button class="btn btn-sub" style="width:100%; margin-bottom:0.5rem;" onclick="expDB()">Export Alles</button>
            <button class="btn btn-sub" style="width:100%; margin-bottom:0.5rem;" onclick="document.getElementById('impFull').click()">Import Alles</button>
            <input type="file" id="impFull" style="display:none" onchange="impDB(this)">
            <button class="btn btn-danger" style="width:100%; margin-top:2rem;" onclick="wipe()">Alles Resetten</button>
         </div>
       </div>
    </div>`;
  }
  
  function modalAddCat(type) { openModal("Nieuwe Categorie", `<input id="newCatName" placeholder="Naam...">`, `<button class="btn btn-sub" onclick="closeModal()">Annuleer</button><button class="btn btn-main" onclick="addCat('${type}')">Opslaan</button>`); }
  function addCat(type) { const n=document.getElementById('newCatName').value; const obj = type==='points'?cfg.points:cfg.rad_challenges; if(n){ obj[n]={}; saveAll(); render(); closeModal(); } }
  
  function modalAddKey(type, c) { openModal(`Nieuw item in ${c}`, `<input id="nkName" placeholder="Naam..."><input id="nkVal" type="number" placeholder="Punten">`, `<button class="btn btn-sub" onclick="closeModal()">Annuleer</button><button class="btn btn-main" onclick="addKey('${type}','${c}')">Opslaan</button>`); }
  function addKey(type, c) { 
      const n=document.getElementById('nkName').value, v=document.getElementById('nkVal').value; 
      const obj = type==='points'?cfg.points:cfg.rad_challenges; 
      if(n&&v){ 
        if(type==='points') obj[c][n] = {v: parseInt(v), t: parseInt(v)>0};
        else obj[c][n]=parseInt(v); 
        saveAll(); render(); closeModal(); 
      } 
  }
  function delKey(type, c, k) { if(confirm("Verwijderen?")) { const obj = type==='points'?cfg.points:cfg.rad_challenges; delete obj[c][k]; saveAll(); render(); } }

  // CONFIG EDIT HELPERS (NIEUW/HERSTELD)
  function rnKey(type, c, oldK, newK) { 
      if(oldK===newK) return; 
      const obj = type==='points'?cfg.points:cfg.rad_challenges; 
      const val = obj[c][oldK]; 
      delete obj[c][oldK]; 
      obj[c][newK] = val; 
      saveAll(); 
  }
  
  function upVal(type, c, k, v) { 
      const obj = type==='points'?cfg.points:cfg.rad_challenges; 
      if(type==='points') {
          let oldT = obj[c][k].t;
          obj[c][k] = { v: parseInt(v), t: oldT };
      } else {
          obj[c][k] = parseInt(v); 
      }
      saveAll(); 
  }
  
  function togTrophy(c, k) {
      if(cfg.points[c] && cfg.points[c][k]) {
          cfg.points[c][k].t = !cfg.points[c][k].t;
          saveAll();
      }
  }

  // Rank Functions
  function rnRank(oldK, newK) { if(oldK===newK) return; const val = cfg.goals[oldK]; delete cfg.goals[oldK]; cfg.goals[newK] = val; saveAll(); }
  function upRank(k, v) { cfg.goals[k] = parseInt(v); saveAll(); }
  function delRank(k) { if(confirm("Rank verwijderen?")) { delete cfg.goals[k]; saveAll(); render(); } }
  function addRank() { const n = document.getElementById('newRankN').value; const v = document.getElementById('newRankV').value; if(n && v) { cfg.goals[n] = parseInt(v); saveAll(); render(); } }

  function setSysSeason() {
      const v = document.getElementById('sysSeason').value;
      if(v) {
          db.currentSeason = v;
          radFilterS = v; 
          saveAll();
          render();
          showToast("Seizoen aangepast naar " + v, "success");
      }
  }

  function expDB() { const s="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify({db,cfg})); const a=document.createElement('a');a.href=s;a.download="cm_backup.json";a.click(); }
  function impDB(el) { const r=new FileReader(); r.onload=(e)=>{ try{ const i=JSON.parse(e.target.result); if(i.db||i.cfg){ if(i.db)db=i.db; if(i.cfg)cfg=i.cfg; saveAll(); render(); showToast("Hersteld!", 'success'); } }catch(x){ showToast("Fout: " + x.message); } }; r.readAsText(el.files[0]); }
  function wipe() { if(confirm("LET OP: Alles wordt verwijderd!")){ db={players:[], currentSeason:"01/02"}; saveAll(); render(); showToast("Gewist", "error"); } }

  // Init
  (async function() { updateUI(); await Cloud.init(); tab('dashboard'); })();
</script>
</body>
</html>
