<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>CM Challenge Pro - V32 Config Trophy Flag Fix</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <meta name="theme-color" content="#0f172a">

  <!-- Modern Font: Inter + Outfit (Flat theme) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="read-only-mode">

<nav>
  <div class="logo" id="main-logo">
      <span style="background:var(--primary); color:#fff; padding:2px 8px; border-radius:6px;">CM</span> PRO
  </div>

  <button class="nav-btn" onclick="tab('dashboard')"><span>🏠</span> <span class="nav-lbl">Dashboard</span></button>
  <button class="nav-btn admin-only" onclick="tab('p')"><span>👥</span> <span class="nav-lbl">Managers</span></button>
  <button class="nav-btn admin-only" onclick="tab('s')"><span>📝</span> <span class="nav-lbl">Seizoen</span></button>
  <button class="nav-btn" onclick="tab('r')"><span>🎲</span> <span class="nav-lbl">RAD</span></button>
  <button class="nav-btn" onclick="tab('st')"><span>📊</span> <span class="nav-lbl">Stats</span></button>
  <button class="nav-btn" onclick="tab('h')"><span>📜</span> <span class="nav-lbl">Historie</span></button>
  <button class="nav-btn admin-only" onclick="tab('c')"><span>⚙️</span> <span class="nav-lbl">Config</span></button>

  <div style="margin-top:auto"></div>
  <div class="theme-toggle nav-btn" onclick="toggleTheme()" style="justify-content:center; border:1px solid var(--border);">
     <span id="theme-icon">🌙</span>
  </div>
  <button id="loginBtn" class="nav-btn login-btn" onclick="openLoginModal()"><span>🔒</span> <span id="loginText">Admin</span></button>
</nav>

<main id="app"></main>
<div id="toast"></div>
<audio id="rad-spin-audio" preload="auto" aria-hidden="true">
  <source src="audio/rad-spin.mp3" type="audio/mpeg">
</audio>

<!-- MODAL STRUCTURE -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="m-title">Titel</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="m-body">
      <!-- Content injected by JS -->
    </div>
    <div class="modal-footer" id="m-footer">
      <!-- Buttons injected by JS -->
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
