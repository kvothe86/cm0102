<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>CM Challenge Pro - V25 Final</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <meta name="theme-color" content="#1a1d29">
  
  <style id="skin-style">
    /* ==========================================================================
       CSS & STYLING (Gebaseerd op V23)
       ========================================================================== */
    :root {
      --bg: #0f1115; --panel: #161b22; --card: #1c2128;
      --accent: #ff3b5c; --accent-hover: #ff5e78; --accent2: #38bdf8;      
      --text: #f0f6fc; --muted: #8b949e; --border: rgba(240, 246, 252, 0.1);
      --input-bg: #0d1117; --radius: 12px; --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    
    [data-theme="light"] {
      --bg: #f3f4f6; --panel: #ffffff; --card: #ffffff;
      --accent: #ef4444; --accent-hover: #dc2626; --accent2: #3b82f6;
      --text: #1f2937; --muted: #6b7280; --border: #e5e7eb; --input-bg: #f9fafb;
      --radius: 12px; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --font: 'Inter', system-ui, sans-serif;
    }

    [data-theme="classic"] {
      --bg: #051333; --panel: #051333; --card: #0a1a45;
      --accent: #FFFF00; --accent-hover: #dada00; --accent2: #D10000; 
      --text: #FFFFFF; --muted: #A6B8D5; --border: #FFFF00;
      --input-bg: #000000; --radius: 0px; --shadow: none;
      --font: 'Verdana', Geneva, sans-serif;
    }

    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; transition: background 0.3s; }

    /* NAVIGATIE */
    nav { width: 240px; background: var(--panel); border-right: 1px solid var(--border); padding: 25px 15px; display: flex; flex-direction: column; gap: 8px; position: fixed; height: 100vh; z-index: 100; overflow-y: auto; }
    .logo { font-weight: 900; color: var(--accent); margin-bottom: 25px; padding-left: 10px; font-size: 1.3rem; letter-spacing: 1px; text-transform: uppercase; }
    [data-theme="classic"] .logo { font-style: italic; background: var(--accent2); color: #fff; padding: 10px; text-align: center; border: 1px solid #fff; text-shadow: 1px 1px #000; font-size: 1.1rem; line-height: 1.2; }

    .nav-btn { background: transparent; border: 1px solid transparent; color: var(--muted); padding: 12px 15px; text-align: left; cursor: pointer; font-weight: 600; border-radius: var(--radius); font-size: 0.95rem; transition: 0.2s; display: flex; align-items: center; gap: 10px; width:100%; }
    .nav-btn:hover { background: rgba(255,255,255,0.03); color: var(--text); }
    .nav-btn.active { background: var(--accent); color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    [data-theme="classic"] .nav-btn { border-radius: 0; }
    [data-theme="classic"] .nav-btn.active { background: var(--accent2); border: 1px solid #fff; color: #fff; box-shadow: 2px 2px 0 #000; }

    .login-btn { margin-top: auto; border-top: 1px solid var(--border); border-radius: 0; padding-top: 20px; color: var(--accent2); }
    .login-btn.logged-in { color: #38d26f; }

    main { flex: 1; margin-left: 240px; padding: 40px; max-width: 1200px; width: 100%; }
    @media (max-width: 900px) { nav { width: 100%; height: auto; position: relative; flex-direction: row; padding: 10px; overflow-x: auto; border-bottom: 1px solid var(--border); border-right: none; } main { margin-left: 0; padding: 20px; } .logo { display: none; } .login-btn { margin-top: 0; border-top: none; padding-top: 12px; } }

    /* COMPONENTS */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; } 
    .grid-config { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
    @media (max-width: 800px) { .grid-config { grid-template-columns: 1fr; } }

    .card { background: var(--card); border-radius: var(--radius); padding: 25px; border: 1px solid var(--border); margin-bottom: 25px; box-shadow: var(--shadow); position: relative; }
    [data-theme="classic"] .card { border: 1px solid var(--accent); }

    h1 { margin: 0 0 10px 0; font-size: 1.8rem; color: var(--accent); }
    h2 { margin-top: 0; font-size: 1rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1.2px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 20px; font-weight: 800; }
    [data-theme="classic"] h2 { background: var(--accent2); color: #fff; border: 1px solid #fff; padding: 8px; text-align: center; font-style: italic; text-shadow: 1px 1px #000; }
    p.page-desc { font-size: 0.9rem; color: var(--muted); margin-bottom: 20px; border-left: 3px solid var(--accent2); padding-left: 10px; font-style: italic; }

    input, select { width: 100%; padding: 10px 15px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; margin-bottom: 15px; font-size: 0.95rem; }
    [data-theme="classic"] input, [data-theme="classic"] select { border-radius: 0; border: 1px solid var(--muted); }
    
    .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-main { background: var(--accent); color: #fff; }
    .btn-sub { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1px solid rgba(255, 77, 77, 0.2); }
    .btn-edit { background: rgba(56, 210, 111, 0.1); color: #38d26f; border: 1px solid rgba(56, 210, 111, 0.2); }
    [data-theme="classic"] .btn { border-radius: 0; box-shadow: 2px 2px 0 #000; border: 1px solid #fff; }
    [data-theme="classic"] .btn-main { background: var(--panel); }

    .action-group { display: flex; gap: 5px; justify-content: flex-end; flex-shrink: 0; }
    .btn-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; border-radius: 6px; font-size: 1rem; background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-toggle { background: rgba(255, 255, 255, 0.05); color: var(--text); font-size: 0.8rem; border: 1px solid var(--border); }
    [data-theme="classic"] .btn-icon { border-radius: 0; border: 1px solid #fff; box-shadow: 1px 1px 0 #000; }

    .opt { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); text-align: left; }
    .opt:hover { background: rgba(255,255,255,0.02); }
    .opt input[type="checkbox"] { margin: 0 15px 0 5px; width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
    .pts { color: var(--accent); font-weight: 800; margin-left: 10px; font-size: 0.9rem; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { color: var(--muted); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; font-weight: 700; }
    .badge { background: var(--panel); color: var(--accent); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-weight: 800; font-family: monospace; }
    [data-theme="classic"] .badge { border-radius: 0; background: #000; border-color: var(--accent); }

    /* DROPDOWNS */
    details { margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; background: rgba(255,255,255,0.02); overflow: hidden; }
    details details { margin-left: 10px; border-left: 3px solid var(--accent); background: rgba(0,0,0,0.15); }
    summary { padding: 12px 15px; font-weight: 700; cursor: pointer; background: var(--card); color: var(--text); list-style: none; display: flex; justify-content: space-between; align-items: center; }
    [data-theme="classic"] summary { background: var(--panel); border-bottom: 1px solid var(--muted); color: var(--accent); }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: '▼'; font-size: 0.8rem; transition: 0.2s; }
    details[open] > summary::after { transform: rotate(180deg); }
    .det-content { padding: 15px; }

    /* SPECIFIEKE PAGINA COMPONENTEN */
    .rank-container { width: 100%; max-width: 220px; }
    .rank-bar-bg { background: rgba(128,128,128,0.2); height: 16px; border-radius: 8px; overflow: hidden; margin-top: 4px; position: relative; border: 1px solid var(--border); }
    .rank-bar-fill { height: 100%; background: var(--accent); transition: width 0.5s ease-out; }
    .rank-meta { font-size: 0.75rem; display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 2px; }
    .rank-val { color: var(--text); font-weight: bold; }
    [data-theme="classic"] .rank-bar-bg { border-radius: 0; border: 1px solid var(--muted); height: 12px; }

    .season-header { background: var(--card); border: 1px solid var(--accent2); padding: 20px; border-radius: var(--radius); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.05); }
    .season-input { font-size: 1.3rem; font-weight: 800; color: var(--accent2); background: var(--input-bg); border: 1px solid var(--border); padding: 8px 15px; width: 200px; text-align: center; margin-left: 10px; border-radius: 8px; }

    .live-score-card { text-align: center; padding: 25px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--panel); border: 2px solid var(--accent); border-radius: var(--radius); box-shadow: 0 0 20px rgba(0,0,0,0.2); margin-bottom: 20px; }
    .live-score-val { font-size: 4rem; font-weight: 900; color: var(--accent); line-height: 1; }
    .live-score-lbl { font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; font-weight: 700; }

    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }

    .stat-row { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-box-global { flex: 1; min-width: 150px; background: var(--panel); padding: 15px; border-radius: var(--radius); text-align: center; border: 1px solid var(--border); }
    .stat-val { font-size: 1.5rem; font-weight: 900; color: var(--accent); margin-bottom: 5px; display: block; }
    .stat-lbl { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); font-weight: 600; }

    .man-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap:10px; }
    .man-rank-badge { font-size: 0.9rem; color: var(--accent2); background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); font-weight: bold; }
    .man-card-top { display: flex; gap: 20px; margin-bottom: 20px; }
    .graph-container { flex: 3; height: 140px; }
    .rating-box { flex: 1; min-width: 90px; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent2); border-radius: var(--radius); display: flex; flex-direction: column; justify-content: center; text-align: center; }
    .rating-val { font-size: 2rem; font-weight: 900; color: var(--accent2); }
    .man-card-mid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; border-top: 1px solid var(--border); padding-top: 20px; }
    .trophy-case { max-height: 250px; overflow-y: auto; }
    .trophy-club-title { font-weight: 800; color: var(--accent2); margin-top: 15px; padding-bottom: 5px; border-bottom: 1px dashed var(--border); font-size: 0.9rem; text-transform: uppercase; }
    .trophy-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 0.9rem; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.03); }
    .rad-gauge { width: 90px; height: 90px; border-radius: 50%; background: conic-gradient(var(--accent) 0%, rgba(128,128,128,0.2) 0%); display: flex; align-items: center; justify-content: center; margin: 0 auto; position: relative; }
    .rad-gauge::before { content: ''; position: absolute; width: 75px; height: 75px; background: var(--card); border-radius: 50%; }
    .rad-text { position: relative; font-weight: bold; font-size: 1.2rem; z-index: 2; }
    .dist-bar { height: 12px; width: 100%; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; display: flex; margin-top: 8px; }
    .dist-seg { height: 100%; }
    .cfg-input { padding: 8px; margin-bottom: 0; height: 36px; }

    /* LOG BOX VOOR DIAGNOSE */
    #log-box { display:none; }

    /* TOAST */
    #toast { visibility: hidden; min-width: 250px; text-align: center; border-radius: 50px; padding: 12px 24px; position: fixed; z-index: 2000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); background-color: var(--panel); color: var(--text); border: 1px solid var(--accent); opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
    #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    #toast.success { border-color: #38d26f; color: #38d26f; }
    #toast.error { border-color: #ff4d4d; color: #ff4d4d; }

    /* LOADING SCREEN */
    .loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; pointer-events: none; opacity: 1; }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .admin-only { display: none !important; }
    body.admin-mode .admin-only { display: flex !important; }
    body.admin-mode button.admin-only { display: inline-flex !important; }
  </style>
</head>
<body class="read-only-mode">

<div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <div style="font-weight:bold; letter-spacing:1px;">LADEN...</div>
</div>

<nav>
  <div class="logo" id="main-logo">CM PRO</div>
  <div class="theme-toggle" onclick="toggleTheme()" style="padding: 10px 15px; cursor: pointer; color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); border-radius: 8px;">
     <span id="theme-icon">🌙</span> <span id="txt-theme">Dark Mode</span>
  </div>
  <button class="nav-btn" onclick="tab('stand')"><span>🏆</span> Klassement</button>
  <button class="nav-btn admin-only" onclick="tab('p')"><span>👥</span> Managers</button>
  <button class="nav-btn admin-only" onclick="tab('s')"><span>📝</span> Seizoen</button>
  <button class="nav-btn" onclick="tab('r')"><span>🎲</span> RAD</button>
  <button class="nav-btn" onclick="tab('st')"><span>📊</span> Stats</button>
  <button class="nav-btn" onclick="tab('h')"><span>📜</span> Historie</button>
  <button class="nav-btn admin-only" onclick="tab('c')"><span>⚙️</span> Config</button>
  
  <button id="loginBtn" class="nav-btn login-btn" onclick="toggleAdmin()"><span>🔒</span> <span id="loginText">Admin Login</span></button>
</nav>

<main id="app"></main>
<div id="toast"></div>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot, deleteDoc, writeBatch, addDoc } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

  // JOUW CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyCH3EF5ZaqoImtWyEH-wk60So-zJ7XoZsQ",
    authDomain: "cm-career-tracker.firebaseapp.com",
    projectId: "cm-career-tracker",
    storageBucket: "cm-career-tracker.firebasestorage.app",
    messagingSenderId: "514929330030",
    appId: "1:514929330030:web:4ff260e4bfb15e5fdee37f",
    measurementId: "G-K09MW4DDMH"
  };

  const envConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
  
  // --- GLOBALE VARIABELEN ---
  let app, db, auth;
  let players = [];
  let cfg = { 
    currentSeason: "01/02",
    points: { "Nationaal": { "Landskampioen": {v:10, t:true}, "Bekerwinnaar": {v:6, t:true} }, "Europees": { "CL Winnaar": {v:20, t:true} } },
    rad_challenges: { "Transfers": { "Koop 35+ speler": 10 } },
    goals: { "Beginner": 100, "Zilver": 200, "Goud": 300, "Legend": 500 }
  };
  
  let curTab = 'stand', isAdmin = false, activeRadP = null, editIdx = null;
  const themes = ['dark', 'light', 'classic'];
  let currentThemeIdx = themes.indexOf(localStorage.getItem('cm_theme') || 'dark');
  let histFilterM='ALL', histFilterS='ALL', radFilterS='ALL';
  let statsFilters = {};

  // --- INIT FUNCTIE ---
  async function init() {
    applyTheme();
    try {
      app = initializeApp(envConfig);
      db = getFirestore(app);
      auth = getAuth(app);
      
      await signInAnonymously(auth);
      onAuthStateChanged(auth, (user) => {
        if (user) setupListeners();
      });
    } catch(e) { console.error("Init Fout", e); showToast("Start Fout: "+e.message, 'error'); }
  }

  function setupListeners() {
    // Luister naar Config (vereenvoudigd pad)
    onSnapshot(doc(db, 'settings', 'config'), (snap) => {
        if(snap.exists()) cfg = snap.data();
        else setDoc(doc(db, 'settings', 'config'), cfg);
        render();
    });

    // Luister naar Spelers
    onSnapshot(collection(db, 'players'), (snap) => {
        players = [];
        snap.forEach(d => players.push({id: d.id, ...d.data()}));
        document.getElementById('loading').classList.add('hidden');
        if(!activeRadP && players.length) activeRadP = players[0].id;
        render();
    });
  }

  // --- HELPER FUNCTIES ---
  window.saveConfig = async () => { await setDoc(doc(db, 'settings', 'config'), cfg); showToast("Instellingen opgeslagen"); render(); };
  function showToast(m,t='info'){ const x=document.getElementById('toast'); x.innerText=m; x.className=`show ${t}`; setTimeout(()=>x.className='',3000); }
  function esc(s){ return s?s.toString().replace(/</g,"&lt;"):s; }
  
  window.toggleTheme = () => { currentThemeIdx = (currentThemeIdx+1)%themes.length; localStorage.setItem('cm_theme', themes[currentThemeIdx]); applyTheme(); };
  function applyTheme() {
    const t = themes[currentThemeIdx];
    document.body.setAttribute('data-theme', t);
    document.getElementById('theme-icon').innerText = t==='light'?'☀️':(t==='classic'?'💾':'🌙');
    document.getElementById('txt-theme').innerText = t==='light'?'Modern':(t==='classic'?'Classic':'Cyber');
    const logo = document.getElementById('main-logo');
    logo.innerHTML = t==='classic' ? 'CM PRO <span style="font-size:0.8em;">V25</span>' : 'CM PRO <span style="font-size:0.5em; opacity:0.5; border:1px solid var(--accent); padding:0 4px; border-radius:4px; margin-left:8px;">V25</span>';
    logo.style.fontStyle = t==='classic' ? 'italic' : 'normal';
  }

  window.toggleAdmin = () => {
      if(isAdmin) {
          isAdmin = false;
          document.body.classList.remove('admin-mode');
          document.getElementById('loginText').innerText = "Admin Login";
          document.getElementById('loginBtn').classList.remove('logged-in');
          tab('stand'); showToast("Uitgelogd");
      } else {
          const pw = prompt("Wachtwoord:");
          if(pw === "admin123") {
              isAdmin = true;
              document.body.classList.add('admin-mode');
              document.getElementById('loginText').innerText = "Uitloggen";
              document.getElementById('loginBtn').classList.add('logged-in');
              showToast("Welkom Admin", 'success'); render();
          } else showToast("Fout wachtwoord", "error");
      }
  };

  window.tab = (n) => { curTab=n; editIdx=null; document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); const btn=document.querySelector(`button[onclick="tab('${n}')"]`); if(btn)btn.classList.add('active'); render(); };

  function getRank(pts) {
      const s = Object.entries(cfg.goals).sort((a,b)=>a[1]-b[1]);
      let c="Rookie", min=0, max=s[0][1], idx=0;
      for(let i=0; i<s.length; i++) { if(pts>=s[i][1]){ c=s[i][0]; min=s[i][1]; max=s[i+1]?s[i+1][1]:min; idx=i+1; } }
      const perc = max>min ? Math.min(100, ((pts-min)/(max-min))*100) : 100;
      const icons = ["🥉", "🥈", "🥇", "💎", "👑"];
      let icon = (idx < icons.length && idx > 0) ? icons[idx-1] : (idx>0 ? "🏆" : "");
      return { name:c, perc, max, color: themes[currentThemeIdx]==='classic'?'#ffff00':'#ff3b5c', icon, isRanked: idx>0 };
  }
  function isTrophy(cat, item) {
      if(cfg.points[cat] && cfg.points[cat][item]) return cfg.points[cat][item].t;
      for(let c in cfg.points) if(cfg.points[c][item]) return cfg.points[c][item].t;
      return false;
  }

  // --- RENDERERS ---
  function render() {
      const con = document.getElementById('app'); con.innerHTML = '';
      if(['p','s','c'].includes(curTab) && !isAdmin) curTab = 'stand';
      
      const renderers = { 'stand': renderStand, 'p': renderP, 's': renderS, 'r': renderR, 'st': renderStats, 'h': renderHist, 'c': renderCfg };
      if(renderers[curTab]) renderers[curTab](con);
  }

  // 1. KLASSEMENT
  function renderStand(con) {
      const lb = players.map(p => ({...p, total: (p.seasons||[]).reduce((a,b)=>a+b.total,0)})).sort((a,b)=>b.total-a.total);

               <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><label style="font-size:0.75rem; color:var(--accent2); font-weight:bold;">TOPSCORER</label><label style="font-size:0.75rem; color:var(--accent2); font-weight:bold;">CIJFER</label></div>
               <div style="display:flex; gap:10px;"><input id="inpTSN" placeholder="Naam Speler" style="flex:2; margin-bottom:0;"><input id="inpTSG" type="number" placeholder="Dlp" style="width:70px; margin-bottom:0;"><input id="inpRate" type="number" placeholder="1-10" step="0.1" style="width:70px; margin-bottom:0; font-weight:bold; color:var(--accent2);"></div>

  window.updGlobS = async (v) => { cfg.currentSeason = v; saveConfig(); };
  window.nextS = () => { let c=cfg.currentSeason, [y1,y2]=c.split('/').map(Number); if(y1){ window.updGlobS(`${y1+1<10?'0':''}${y1+1}/${y2+1<10?'0':''}${y2+1}`); showToast("Nieuw seizoen gestart!"); } };
  window.cancelEdit = () => { editIdx=null; render(); };
  window.upS = () => {
      const pId = document.getElementById('selP')?.value; if(!pId) return;
      const p = players.find(x => x.id == pId); 
      let formYear = document.getElementById('inpY').value || cfg.currentSeason;
      let curS = (editIdx!==null) ? p.seasons[editIdx] : null; 
      if(curS && editIdx!==null) {
         formYear = curS.year; document.getElementById('inpY').value = formYear;
         document.getElementById('inpTSN').value = curS.tsName || ''; document.getElementById('inpTSG').value = curS.tsGoals || '';
         document.getElementById('inpRate').value = curS.rating || ''; document.getElementById('inpC').value = curS.club || '';
      }
      let h = '';
      for(let c in cfg.points) { 
          h += `<details><summary>${c}</summary><div class="det-content">`; 
          for(let k in cfg.points[c]) { 
              let item = cfg.points[c][k]; let val = (typeof item === 'object') ? item.v : item;
              let chk = (curS && (curS.items||[]).includes(k)) ? 'checked' : ''; 
              h += `<label class="opt"><input type="checkbox" class="p-cb" onchange="calcLive()" data-v="${val}" data-n="${k}" ${chk}><span>${k}</span><span class="pts">+${val}</span></label>`; 
          } 
          h += `</div></details>`; 
      }

      document.getElementById('quickHist').innerHTML = (p.seasons||[]).map((s,i) => `<div class="opt"><span><b>${s.year}</b> - ${esc(s.club)} (${s.total}p)</span><div class="action-group"><button class="btn-icon btn-edit" onclick="editSeason('${p.id}',${i})">✏️</button><button class="btn-icon btn-del" onclick="delS('${p.id}',${i})">🗑️</button></div></div>`).reverse().join('');
      calcLive();
  };
  window.calcLive = () => {
      const pId = document.getElementById('selP').value; const p = players.find(x => x.id == pId);
      let t=0; document.querySelectorAll('.p-cb:checked').forEach(c => t+=parseInt(c.dataset.v));
      document.querySelectorAll('.r-cb:checked').forEach(c => { const r=(p.rads||[]).find(x=>x.id==c.dataset.id); if(r) t+=r.pts; });
      document.getElementById('livePts').innerText = t;
  };
  window.editSeason = (pId, idx) => { editIdx = idx; render(); document.getElementById('selP').value = pId; window.upS(); };
  window.saveS = async () => {
      const pId = document.getElementById('selP').value; const p = players.find(x => x.id == pId);
      let formYear = document.getElementById('inpY').value || cfg.currentSeason;
      let t=0, its=[]; document.querySelectorAll('.p-cb:checked').forEach(c => { t+=parseInt(c.dataset.v); its.push(c.dataset.n); });
      let nRads = [...(p.rads||[])]; document.querySelectorAll('.r-cb').forEach(c => { const r=nRads.find(x=>x.id==c.dataset.id); if(r){ r.done=c.checked; if(c.checked) t+=r.pts; } });
      const d = { year: formYear, club: document.getElementById('inpC').value, total: t, items: its, tsName: document.getElementById('inpTSN').value, tsGoals: document.getElementById('inpTSG').value, rating: document.getElementById('inpRate').value };
      let nSeasons = [...(p.seasons||[])]; if(editIdx!==null) nSeasons[editIdx]=d; else nSeasons.push(d); 
      await updateDoc(doc(db,'players',pId), { seasons:nSeasons, rads:nRads }); editIdx=null; showToast("Opgeslagen", 'success'); render();
  };
  window.delS = async (pId, idx) => { if(confirm("Seizoen verwijderen?")){ const p=players.find(x=>x.id==pId); let nSeasons=[...p.seasons]; nSeasons.splice(idx,1); await updateDoc(doc(db,'players',pId), { seasons:nSeasons }); showToast("Verwijderd"); } };

  // 4. RAD
  function renderR(con) {
     if(!players.length) return con.innerHTML = '<div class="card">Geen managers.</div>';
     if(!activeRadP) activeRadP = players[0].id;
     const pOpts = players.map(p => `<option value="${p.id}" ${p.id==activeRadP?'selected':''}>${esc(p.name)}</option>`).join('');

     const seasons = [...new Set(players.flatMap(p => (p.rads||[]).map(r => r.s)))].sort().reverse();
     const sOpts = `<option value="ALL">Alle Seizoenen</option>` + seasons.map(s => `<option value="${s}" ${s==radFilterS?'selected':''}>${s}</option>`).join('');
     
     let adminControls = `<div class="muted" style="padding:20px; text-align:center; font-style:italic;">Log in als Admin om te draaien.</div>`;
     if(isAdmin) {
         adminControls = `<label>Jaar</label><input type="text" id="rS" value="${cfg.currentSeason}" style="background:var(--bg); font-weight:bold; color:var(--accent2); text-align:center; margin-bottom:10px;">
           <button class="btn btn-main" style="width:100%; padding:15px; font-size:1.1rem;" onclick="roll()">🎲 DRAAIEN</button>
           <div id="rOut" style="margin-top:20px; text-align:center; min-height:80px; padding:10px; border:1px dashed var(--border); border-radius:8px; display:flex; flex-direction:column; justify-content:center; align-items:center;"><span style="color:var(--muted); font-size:0.8rem;">Resultaat...</span></div>
           <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
           <h3>Handmatig</h3>
           <div style="display:flex; gap:10px; margin-bottom:10px;"><div style="flex:1"><label style="font-size:0.7rem; color:var(--muted);">Categorie</label><select id="radCatSel" onchange="upRadT()">${cOpts}</select></div><div style="flex:1"><label style="font-size:0.7rem; color:var(--muted);">Challenge</label><select id="radTaskSel" onchange="fillRad()"></select></div></div>
           <div style="display:flex; gap:10px; margin-top:10px;"><input type="text" id="cT" placeholder="..."><input type="number" id="cP" placeholder="Pts" style="width:80px;"><button class="btn btn-edit" onclick="addManRad()">+</button></div>`;
     }

     con.innerHTML = `<div class="grid"><div class="card"><h2>RAD</h2><label>Manager</label><select onchange="activeRadP=this.value; render()">${pOpts}</select>${adminControls}</div>
       <div class="card"><h2>Actief</h2><select style="margin-bottom:15px;" onchange="window.radFilterS=this.value; render()">${sOpts}</select><div id="actR"></div></div></div>`;

     const p = players.find(x => x.id == activeRadP); 
     if(p) { 
         let rList = p.rads || []; 
         if(radFilterS !== 'ALL') rList = rList.filter(r => r.s === radFilterS); 
         document.getElementById('actR').innerHTML = rList.map(r => `<div class="opt"><span><b>[${r.s}]</b> ${esc(r.text)}</span><span class="pts">${r.pts}p</span>${isAdmin?`<div class="action-group"><button class="btn-icon btn-del" onclick="delRad('${activeRadP}', ${r.id})">🗑️</button></div>`:''}</div>`).join(''); 
     }
     if(isAdmin) upRadT();
  }
  window.upRadT = () => { const c=document.getElementById('radCatSel').value, s=document.getElementById('radTaskSel'); s.innerHTML=''; if(cfg.rad_challenges[c]) for(let k in cfg.rad_challenges[c]){ let o=document.createElement('option'); o.value=k; o.text=k; o.dataset.p=cfg.rad_challenges[c][k]; s.add(o); } fillRad(); };
  window.fillRad = () => { const s=document.getElementById('radTaskSel'); if(s.selectedIndex>=0){ document.getElementById('cT').value=s.value; document.getElementById('cP').value=s.options[s.selectedIndex].dataset.p; } };
  window.addManRad = async () => { const s=document.getElementById('rS').value, tx=document.getElementById('cT').value, p=parseInt(document.getElementById('cP').value); if(s&&tx&&!isNaN(p)){ const pl=players.find(x=>x.id==activeRadP); await updateDoc(doc(db,'players',activeRadP), { rads:[...(pl.rads||[]), {id:Date.now(), s:s, text:tx, pts:p, done:false}] }); showToast("Toegevoegd", 'success'); } };
  window.delRad = async (pId, rId) => { const p=players.find(x=>x.id==pId); await updateDoc(doc(db,'players',pId), { rads:p.rads.filter(r=>r.id!=rId) }); };
  window.roll = () => { const s = document.getElementById('rS').value; if(!s) return showToast("Geen jaar", 'error'); const p = players.find(x => x.id == activeRadP); let pool = []; for(let c in cfg.rad_challenges) for(let k in cfg.rad_challenges[c]) pool.push({t:k, p:cfg.rad_challenges[c][k], c:c}); let out = document.getElementById('rOut'); let i=0; const spin = setInterval(() => { const r = pool[Math.floor(Math.random() * pool.length)]; out.innerText = r.t; i++; if(i>15) { clearInterval(spin); finalizeRoll(r, p, s); } }, 80); };
  window.finalizeRoll = async (pick, p, s) => { document.getElementById('rOut').innerHTML = `<div style="font-size:0.8rem; color:var(--accent2)">${pick.c}</div><div style="font-size:1.2rem; margin:5px 0; font-weight:900;">${pick.t}</div><div class="badge">+${pick.p}</div>`; await updateDoc(doc(db,'players',p.id), { rads:[...(p.rads||[]), {id:Date.now(), s:s, text:pick.t, pts:pick.p, done:false}] }); showToast("Toegewezen!", 'success'); };

  // 5. STATS
  function renderStats(con) {
     if(!players.length) return con.innerHTML = `<div class="card">Geen data.</div>`;
     let bs={p:'-',v:0, l:''}, mt={p:'-',v:0}, rk={p:'-',v:0};
     players.forEach(p => { (p.seasons||[]).forEach(s => { if(s.total > bs.v) bs = {p:p.name, v:s.total, l:s.year}; }); let tc = (p.seasons||[]).reduce((a,s)=>(s.items||[]).length+a, 0); if(tc>mt.v) mt={p:p.name, v:tc}; let rc = (p.rads||[]).filter(r=>r.done).length; if(rc>rk.v) rk={p:p.name, v:rc}; });
     
     let h = `<div class="stat-row"><div class="stat-box-global"><span class="stat-val">${bs.v}</span><span class="stat-lbl">Record (${bs.l})<br>${esc(bs.p)}</span></div><div class="stat-box-global"><span class="stat-val">${mt.v}</span><span class="stat-lbl">Meeste Prijzen<br>${esc(mt.p)}</span></div><div class="stat-box-global"><span class="stat-val">${rk.v}</span><span class="stat-lbl">RAD Koning<br>${esc(rk.p)}</span></div></div>`;
     
     players.forEach(p => {
         let seasons = p.seasons || []; 
         let tot = seasons.reduce((a,b)=>a+b.total,0); let rads = p.rads || []; 
         let radP = rads.filter(r=>r.done).reduce((a,b)=>a+b.pts,0); let resP = Math.max(0, tot-radP); let pp1 = tot>0?(resP/tot)*100:0, pp2 = tot>0?(radP/tot)*100:0;
         let totRads = rads.length, doneRads = rads.filter(r=>r.done).length, gPerc = totRads>0?Math.round((doneRads/totRads)*100):0;
         let pTopS = {n:'-', g:0, y:'-'}; let totRate = 0, ratedCnt = 0; seasons.forEach(s => { let g = parseInt(s.tsGoals || 0); if(g > pTopS.g) pTopS = {n:s.tsName, g:g, y:s.year}; if(s.rating) { totRate += parseFloat(s.rating); ratedCnt++; } });
         let avgRate = ratedCnt > 0 ? (totRate / ratedCnt).toFixed(1) : '-';
         let topScorerHTML = (pTopS.g > 0) ? `<div style="margin-top:15px; font-size:0.9rem; color:var(--text); background:rgba(0,0,0,0.2); padding:10px; border-radius:8px; border:1px solid var(--border);">Topscorer: <b style="color:var(--accent2)">${esc(pTopS.n)}</b> (${pTopS.g} goals) - <span style="color:var(--muted)">${pTopS.y}</span></div>` : '';
         const rp = getRank(tot);
         const rankBadge = rp.isRanked ? `<span class="man-rank-badge">${rp.icon} ${rp.name}</span>` : '';

         h += `<div class="card"><div class="man-header-row"><div style="display:flex; align-items:center; gap:10px;"><h1>${esc(p.name)}</h1>${rankBadge}</div></div><div class="man-card-top"><div class="graph-container">${renderGraph(seasons)}</div><div class="rating-box"><div class="rating-val">${avgRate}</div><div class="rating-lbl">GEM. CIJFER</div></div></div><div class="man-card-mid"><div><h3>Palmares</h3><div class="trophy-case">${renderTrophies(seasons)}</div>${topScorerHTML}</div><div><h3>RAD Progressie</h3><div style="text-align:center; padding:20px;"><div class="rad-gauge" style="background:conic-gradient(var(--accent) ${gPerc}%, rgba(128,128,128,0.1) ${gPerc}%)"><div class="rad-text">${gPerc}%</div></div><div style="margin-top:15px; font-size:0.9rem;"><div>Voltooid: <b>${doneRads}</b></div><div>Totaal: <b>${totRads}</b></div></div></div></div></div><div style="border-top:1px solid var(--border); padding-top:15px;"><label style="font-size:0.75rem; color:var(--muted);">Puntverdeling</label><div class="dist-bar"><div class="dist-seg" style="width:${pp1}%; background:var(--accent2);"></div><div class="dist-seg" style="width:${pp2}%; background:var(--accent);"></div></div><div style="display:flex; justify-content:space-between; font-size:0.7rem; margin-top:4px;"><span>Resultaten (${Math.round(pp1)}%)</span><span>RAD (${Math.round(pp2)}%)</span></div></div></div>`;
     });
     con.innerHTML = h;
  }
  function renderTrophies(seasons) {
      let clubs = {}; seasons.forEach(s => { if(!clubs[s.club]) clubs[s.club] = []; (s.items||[]).forEach(i => clubs[s.club].push(i)); });
      let html = ''; 
      for(let c in clubs) { 
          if(!clubs[c].length) continue; 
          let counts = {}; 
          clubs[c].forEach(item => { if(isTrophy('Nationaal', item) || isTrophy('Europees', item)) counts[item] = (counts[item]||0)+1; else if(isTrophy(Object.keys(cfg.points)[0], item)) counts[item] = (counts[item]||0)+1; });
          if(Object.keys(counts).length === 0) continue; 
          html += `<div class="trophy-club-title">${esc(c)}</div>`; 
          for(let k in counts) { 
             let icon = "🏆"; if(k.includes("Beker")) icon="🍷"; if(k.includes("CL") || k.includes("Europees")) icon="🇪🇺"; if(k.includes("Promotie")) icon="🆙";
             html += `<div class="trophy-row"><span>${counts[k]}x ${k}</span><span>${icon.repeat(counts[k])}</span></div>`; 
          } 
      }
      return html || '<div class="muted" style="font-size:0.8rem">Nog geen prijzen.</div>';
  }
  function renderGraph(seasons) {
      if(seasons.length < 1) return '<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font-style:italic;">Nog geen data</div>';
      const w = 600, h = 140; const maxVal = Math.max(...seasons.map(s=>s.total), 10);
      const barWidth = (w / seasons.length) * 0.6; const gap = (w / seasons.length) * 0.4;
      let svg = `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible">`;
      seasons.forEach((s, i) => { const x = (i * (w / seasons.length)) + (gap/2); const barH = (s.total / maxVal) * (h - 20); const y = h - barH; svg += `<rect x="${x}" y="${y}" width="${barWidth}" height="${barH}" fill="var(--accent)" rx="4" /><text x="${x + barWidth/2}" y="${y - 5}" fill="var(--text)" text-anchor="middle" font-size="20" font-weight="bold">${s.total}</text>`; });
      return svg + `</svg>`;
  }

  // 6. HISTORIE
  function renderHist(con) {
     const mOpts = `<option value="ALL">Alle Managers</option>` + players.map(p=>`<option value="${p.id}" ${p.id==histFilterM?'selected':''}>${esc(p.name)}</option>`).join('');
     const seasons = [...new Set(players.flatMap(p => (p.seasons||[]).map(s => s.year)))].sort().reverse();
     const sOpts = `<option value="ALL">Alle Seizoenen</option>` + seasons.map(s => `<option value="${s}" ${s==histFilterS?'selected':''}>${s}</option>`).join('');
     let rows = []; players.forEach(p => (p.seasons||[]).forEach((s,i) => rows.push({id:p.id, name:p.name, s:s, idx:i, rads: (p.rads||[]).filter(r => r.s === s.year && r.done)})));
     rows = rows.filter(r => (histFilterM==='ALL' || r.id==histFilterM) && (histFilterS==='ALL' || r.s.year==histFilterS));
     rows.sort((a,b) => b.s.year.localeCompare(a.s.year) || b.s.total - a.s.total);
     const getAch = (r) => { let items = [...(r.s.items || [])]; r.rads.forEach(rd => items.push(`🎲 ${rd.text}`)); return items.join(', '); };
     con.innerHTML = `<div class="card"><h2>Historie</h2><div class="filter-bar"><select onchange="window.histFilterM=this.value; render()">${mOpts}</select><select onchange="window.histFilterS=this.value; render()">${sOpts}</select></div><div style="overflow-x:auto;"><table><thead><tr><th>Manager</th><th>Jaar</th><th>Club</th><th>Topscorer</th><th>Details</th><th>Punten</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${esc(r.name)}</b></td><td>${r.s.year}</td><td>${esc(r.s.club)} ${r.s.rating ? ' <span style="color:#f1c40f; font-weight:bold;">★'+r.s.rating+'</span>' : ''}</td><td style="color:var(--accent2);">${r.s.tsName ? esc(r.s.tsName) + ' ('+r.s.tsGoals+')' : '-'}</td><td style="font-size:0.85rem; color:var(--muted);">${getAch(r)}</td><td><span class="badge">${r.s.total}</span></td><td>${isAdmin?`<div class="action-group"><button class="btn-icon btn-edit" onclick="tab('s'); editSeason('${r.id}',${r.idx})">✏️</button><button class="btn-icon btn-del" onclick="delS('${r.id}',${r.idx})">🗑️</button></div>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
  }

  // 7. CONFIG
  function renderCfg(con) {
    if(!isAdmin) return;
    let leftCol = `<div class="grid-config"><div><details open><summary>Punten</summary><div class="det-content"><div style="margin-bottom:15px; display:flex; gap:10px;"><input id="nPC" placeholder="Nieuwe Categorie..."><button class="btn btn-main" style="width:auto;" onclick="addCat('points')">+</button></div>`;
    for(let c in cfg.points) { 
        leftCol += `<details><summary>${c}</summary><div class="det-content">`; 
        for(let k in cfg.points[c]) { 
            let item = cfg.points[c][k]; let val = (typeof item === 'object') ? item.v : item; let isT = (typeof item === 'object') ? item.t : (val > 0);
            leftCol += `<div class="opt"><input class="cfg-input" value="${k}" onchange="rnKey('points','${c}','${k}',this.value)" style="flex:2"><input type="number" class="cfg-input" style="width:60px; flex:none;" value="${val}" onchange="upVal('points','${c}','${k}',this.value)"><button class="btn-icon btn-toggle" onclick="togTrophy('${c}','${k}')" title="Trofee?">${isT?'🏆':'📝'}</button><button class="btn-icon btn-del" onclick="delKey('points','${c}','${k}')">🗑️</button></div>`; 
        } 
        leftCol += `<div style="display:flex; gap:5px; margin-top:5px;"><input id="pi_n_${c}" placeholder="..."><input id="pi_v_${c}" type="number" placeholder="0" style="width:60px;"><button class="btn btn-edit" onclick="addKey('points','${c}')">+</button></div></div></details>`; 
    }
    leftCol += `</div></details><details><summary>RAD Challenges</summary><div class="det-content"><div style="margin-bottom:15px; display:flex; gap:10px;"><input id="nRC" placeholder="Nieuwe Categorie..."><button class="btn btn-main" style="width:auto;" onclick="addCat('rad')">+</button></div>`;
    for(let c in cfg.rad_challenges) { leftCol += `<details><summary>${c}</summary><div class="det-content">`; for(let k in cfg.rad_challenges[c]) { leftCol += `<div class="opt"><input class="cfg-input" value="${k}" onchange="rnKey('rad','${c}','${k}',this.value)"><input type="number" class="cfg-input" style="width:60px" value="${cfg.rad_challenges[c][k]}" onchange="upVal('rad','${c}','${k}',this.value)"><button class="btn-icon btn-del" onclick="delKey('rad','${c}','${k}')">🗑️</button></div>`; } leftCol += `<div style="display:flex; gap:5px; margin-top:5px;"><input id="ri_n_${c}" placeholder="..."><input id="ri_v_${c}" type="number" placeholder="0" style="width:60px;"><button class="btn btn-edit" onclick="addKey('rad','${c}')">+</button></div></div></details>`; }
    leftCol += `</div></details></div><div><div class="card" style="border:1px solid var(--accent);"><h2>⚠️ Migratie</h2><p>Upload hier je oude <b>backup.json</b> om de database te vullen.</p><input type="file" id="fImp" accept=".json" style="margin-top:10px;"><button class="btn btn-main" onclick="migr()">Importeer</button><div id="mLog" style="margin-top:10px; font-family:monospace; font-size:0.8rem;"></div></div></div></div>`;
    con.innerHTML = leftCol;
  }
  window.addCat = async (t) => { const id=t=='points'?'nPC':'nRC', obj=t=='points'?cfg.points:cfg.rad_challenges, n=document.getElementById(id).value; if(n){ obj[n]={}; await saveConfig(); render(); } };
  window.addKey = async (t,c) => { const n=document.getElementById(t=='points'?`pi_n_${c}`:`ri_n_${c}`).value, v=document.getElementById(t=='points'?`pi_v_${c}`:`ri_v_${c}`).value; if(n&&v){ if(t=='points') cfg.points[c][n]={v:parseInt(v), t:parseInt(v)>0}; else cfg.rad_challenges[c][n]=parseInt(v); await saveConfig(); render(); } };
  window.delKey = async (t,c,k) => { if(t=='points') delete cfg.points[c][k]; else delete cfg.rad_challenges[c][k]; await saveConfig(); render(); };
  window.rnKey = async (t,c,ok,nk) => { if(ok==nk)return; const obj=t=='points'?cfg.points:cfg.rad_challenges, v=obj[c][ok]; delete obj[c][ok]; obj[c][nk]=v; await saveConfig(); render(); };
  window.upVal = async (t,c,k,v) => { if(t=='points') cfg.points[c][k].v=parseInt(v); else cfg.rad_challenges[c][k]=parseInt(v); await saveConfig(); };
  window.togTrophy = async (c,k) => { cfg.points[c][k].t = !cfg.points[c][k].t; await saveConfig(); render(); };
  
  window.migr = () => {
      const f=document.getElementById('fImp').files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=async(e)=>{
          const d=JSON.parse(e.target.result); const l=document.getElementById('mLog'); l.innerText="Bezig...";
          const b=writeBatch(db); let c=0;
          if(d.cfg) b.set(doc(db,'settings','config'), d.cfg);
          if(d.db && d.db.players) d.db.players.forEach(p=>{ b.set(doc(collection(db,'players')), {name:p.name, seasons:p.seasons||[], rads:p.rads||[]}); c++; });
          await b.commit(); l.innerHTML=`<b style="color:#38d26f">Klaar! ${c} managers geimporteerd.</b>`; showToast("Succes!");
      }; r.readAsText(f);
  };

  init();
</script>
</body>
</html>
